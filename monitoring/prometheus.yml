global: {scrape_interval: 15s}
rule_files: [/etc/prometheus/alertas.rules.yml]
scrape_configs:
  - job_name: servicios
    metrics_path: /metrics
    static_configs:
      - targets: [auth:8000, ruc:8000, rhe:8000, declaraciones:8000, alertas:8000, simulador:8000, fraccionamiento:8000, datos-privados:8000]
