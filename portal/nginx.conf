# Portal ciudadano + puerta de enlace (API gateway) de la nube pública.
# Termina HTTP interno (el TLS lo termina el balanceador/Ingress), limita tasa y aplica encabezados de seguridad.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_status 429;

  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","m":"$request_method","uri":"$uri","st":$status,"ms":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Cache-Control $static_cache_control always;

  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    set $static_cache_control "";

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://auth:8000; }
    location /api/auth/      { limit_req zone=login burst=10 nodelay; proxy_pass http://auth:8000; }
    location /api/ruc/             { limit_req zone=api burst=60 nodelay; proxy_pass http://ruc:8000; }
    location /api/rhe              { limit_req zone=api burst=60 nodelay; proxy_pass http://rhe:8000; }
    location /api/declaraciones    { limit_req zone=api burst=60 nodelay; proxy_pass http://declaraciones:8000; }
    location /api/alertas/         { limit_req zone=api burst=60 nodelay; proxy_pass http://alertas:8000; }
    location /api/simulador/       { limit_req zone=api burst=60 nodelay; proxy_pass http://simulador:8000; }
    location = /api/fraccionamiento { limit_req zone=api burst=60 nodelay; proxy_pass http://fraccionamiento:8000; }
    location /api/fraccionamiento/ { limit_req zone=api burst=60 nodelay; proxy_pass http://fraccionamiento:8000; }
    location = /api/documentos     { limit_req zone=api burst=60 nodelay; proxy_pass http://documentos:8000; }
    location /api/documentos/      { limit_req zone=api burst=60 nodelay; client_max_body_size 3m; proxy_pass http://documentos:8000; }
    location = /api/pagos          { limit_req zone=api burst=60 nodelay; proxy_pass http://pagos:8000; }
    location /api/pagos/           { limit_req zone=api burst=60 nodelay; proxy_pass http://pagos:8000; }

    location / { set $static_cache_control "no-cache"; try_files $uri /index.html; }
  }
}
