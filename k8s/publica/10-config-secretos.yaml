apiVersion: v1
kind: ConfigMap
metadata:
  name: tramites-config
  namespace: tramites
data:
  DATOS_URL: http://datos-privados:8000
  JWT_MINUTOS: '30'

---
apiVersion: v1
kind: Secret
metadata:
  name: tramites-secretos
  namespace: tramites
  annotations:
    nota: PLANTILLA. En producción se sincroniza desde el gestor de secretos (External Secrets / CSI). No versionar valores
      reales.
type: Opaque
stringData:
  INTERNAL_API_KEY: REEMPLAZAR
  JWT_SECRET: REEMPLAZAR
