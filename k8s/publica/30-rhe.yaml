apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhe
  namespace: tramites
  labels: &id001
    app: rhe
    app.kubernetes.io/part-of: tramites-tributarios
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rhe
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: rhe
      containers:
      - name: rhe
        image: tramites/rhe:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 150m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: tramites-config
        - secretRef:
            name: tramites-secretos
      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: rhe
  namespace: tramites
  labels:
    app: rhe
    app.kubernetes.io/part-of: tramites-tributarios
spec:
  selector:
    app: rhe
  ports:
  - name: http
    port: 8000
    targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rhe
  namespace: tramites
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rhe
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rhe
  namespace: tramites
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rhe
