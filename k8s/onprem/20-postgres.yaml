apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tramites-datos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: tramites-tributarios
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: pg
        env:
        - name: POSTGRES_DB
          value: tramites
        - name: POSTGRES_USER
          value: tramites
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datos-secretos
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - tramites
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: datos
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: datos
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tramites-datos
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: pg
