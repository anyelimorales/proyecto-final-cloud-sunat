apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: respaldos
  namespace: tramites-datos
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: respaldo
  namespace: tramites-datos
  annotations:
    eks.amazonaws.com/role-arn: REEMPLAZAR_ARN_ROL_RESPALDO
    nota: Rol IRSA con permiso de escritura solo sobre el bucket de respaldos (infra/terraform/main.tf).

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: respaldo-destino
  namespace: tramites-datos
data:
  BACKUP_S3_URI: s3://REEMPLAZAR_BUCKET_RESPALDOS/postgres
  AWS_REGION: sa-east-1
  KMS_KEY_ARN: REEMPLAZAR_ARN_KMS

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: respaldo-postgres
  namespace: tramites-datos
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: respaldo
        spec:
          restartPolicy: OnFailure
          serviceAccountName: respaldo
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          - name: volcado
            image: postgres:16-alpine
            command:
            - sh
            - -c
            - set -e; archivo=/respaldos/tramites_$(date -u +%Y%m%dT%H%M%SZ).sql.enc; pg_dump -h postgres -U tramites --no-owner
              --clean --if-exists tramites | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -out "$archivo";
              sha256sum "$archivo" > "$archivo.sha256"; echo -n "$archivo" > /respaldos/.ultimo; find /respaldos -name 'tramites_*.enc*'
              -mtime +14 -delete
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: datos-secretos
                  key: POSTGRES_PASSWORD
            - name: BACKUP_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: datos-secretos
                  key: BACKUP_PASSPHRASE
            securityContext: &id001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: r
              mountPath: /respaldos
            - name: tmp
              mountPath: /tmp
          containers:
          - name: subida
            image: amazon/aws-cli:2.17.0
            command:
            - sh
            - -c
            - 'set -e; archivo=$(cat /respaldos/.ultimo); aws s3 cp "$archivo" "$BACKUP_S3_URI/$(basename "$archivo")" --sse
              aws:kms --sse-kms-key-id "$KMS_KEY_ARN"; aws s3 cp "$archivo.sha256" "$BACKUP_S3_URI/$(basename "$archivo").sha256"
              --sse aws:kms --sse-kms-key-id "$KMS_KEY_ARN"; echo "respaldo replicado: $(basename "$archivo")"'
            envFrom:
            - configMapRef:
                name: respaldo-destino
            securityContext: *id001
            volumeMounts:
            - name: r
              mountPath: /respaldos
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: r
            persistentVolumeClaim:
              claimName: respaldos
          - name: tmp
            emptyDir: {}
